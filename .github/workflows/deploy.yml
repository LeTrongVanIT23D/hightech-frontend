name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hightech-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/hightech-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Build & Push Successful
        run: |
          echo "Docker image has been successfully built and pushed to Docker Hub!"
          echo "Tag: ${{ secrets.DOCKER_USERNAME }}/hightech-frontend:latest"
