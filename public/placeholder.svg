<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="subtleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Decorative geometric elements -->
  <circle cx="400" cy="360" r="220" fill="none" stroke="url(#subtleGrad)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="400" cy="360" r="160" fill="none" stroke="url(#subtleGrad)" stroke-width="1"/>
  <circle cx="400" cy="360" r="100" fill="#ff0000" fill-opacity="0.04" filter="url(#glow)"/>

  <!-- Stylized Sports Sneaker / Emblem Icon -->
  <g transform="translate(400, 340) scale(1.4)" filter="url(#glow)">
    <!-- Shoe Sole Base -->
    <path d="M -85,45 C -70,55 -30,58 30,55 C 65,53 85,40 90,25 C 92,20 85,15 75,18 C 50,25 20,25 -20,28 C -60,31 -80,35 -85,45 Z" fill="url(#primaryGrad)"/>
    <!-- Shoe Upper Body -->
    <path d="M -82,36 C -80,10 -65,-5 -45,-12 C -30,-18 -10,-10 10,-30 C 25,-45 40,-48 55,-35 C 68,-23 75,-5 82,15 C 80,18 60,18 35,16 C -10,12 -55,18 -82,36 Z" fill="#27272a" stroke="url(#primaryGrad)" stroke-width="2"/>
    <!-- Dynamic Speed Lines / Swoosh style stripes -->
    <path d="M -30,-2 C -10,2 25,-12 55,-25" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M -25,12 C 0,14 30,3 62,-10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M -15,22 C 10,23 35,15 68,2" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="400" y="520" text-anchor="middle" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="6">
    HIGHTECH
  </text>
  <text x="400" y="555" text-anchor="middle" fill="#ff3333" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="8">
    SPORT PERFORMANCE
  </text>

  <!-- Subtle corner accents -->
  <path d="M 40,60 L 40,40 L 60,40" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 760,60 L 760,40 L 740,40" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 40,740 L 40,760 L 60,760" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 760,740 L 760,760 L 740,760" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
